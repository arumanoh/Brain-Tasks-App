apiVersion: v1
kind: Service
metadata:
  name: brain-tasks-app-svc
  labels:
    app: brain-tasks-app
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: brain-tasks-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
